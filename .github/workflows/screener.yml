# 每天凌晨 3:00（台北時間）預先算好「內建大型股」的篩選資料，存成 screener.json，讓所有會員共用。
# GitHub 的排程偶爾會延遲數十分鐘，所以實際完成時間大約落在 3:00～4:00。
# 手動執行：GitHub 網頁 → Actions → nightly-screener → Run workflow。
# 選填：到 Settings → Secrets and variables → Actions 新增 FINMIND_TOKEN，額度會比較寬鬆。
name: nightly-screener
on:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 台北 03:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screener
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 計算篩選資料
        run: node scripts/screener_job.js
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: 有更新才存回儲存庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screener.json
          # 計算期間如果有人更新了 main（例如剛好上傳新版網頁），先接上最新的再推，避免被拒絕
          git diff --cached --quiet || (git commit -m "Nightly screener data" && git pull --rebase -q origin main && git push)
